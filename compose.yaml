name: certhia
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-certhia}
      POSTGRES_USER: ${POSTGRES_USER:-certhia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certhia}
    command: ["postgres", "-c", "default_toast_compression=lz4", "-c", "shared_buffers=128MB", "-c", "work_mem=4MB"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-certhia}", "-d", "${POSTGRES_DB:-certhia}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  app:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      args:
        CERTHIA_CARGO_FEATURES: ${CERTHIA_CARGO_FEATURES:-}
      target: ${CERTHIA_BUILD_TARGET:-production}
    ports:
      - "127.0.0.1:${CERTHIA_PORT:-3001}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-certhia}:${POSTGRES_PASSWORD:-certhia}@postgres/${POSTGRES_DB:-certhia}}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-}
      CERTHIA_ALLOWED_HOSTS: ${CERTHIA_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      # This Compose port is loopback-only. Set secure cookies to 1 for HTTPS.
      CERTHIA_AUTH_SECURE_COOKIE: ${CERTHIA_AUTH_SECURE_COOKIE:-0}
      CERTHIA_AUTH_ORIGIN: ${CERTHIA_AUTH_ORIGIN:-}
      CERTHIA_AUTH_LOCAL: ${CERTHIA_AUTH_LOCAL:-1}
      CERTHIA_AUTH_TRUSTED_PROXIES: ${CERTHIA_AUTH_TRUSTED_PROXIES:-}
      CERTHIA_ADMIN_EMAIL: ${CERTHIA_ADMIN_EMAIL:-}
      CERTHIA_ADMIN_PASSWORD: ${CERTHIA_ADMIN_PASSWORD:-}
      CERTHIA_ADMIN_PASSWORD_FILE: ${CERTHIA_ADMIN_PASSWORD_FILE:-}
      CERTHIA_SETUP_TOKEN: ${CERTHIA_SETUP_TOKEN:-}
      CERTHIA_SETUP_TOKEN_FILE: ${CERTHIA_SETUP_TOKEN_FILE:-}
      CERTHIA_OIDC_PROVIDERS: ${CERTHIA_OIDC_PROVIDERS:-}
      CERTHIA_OIDC_PROVIDERS_FILE: ${CERTHIA_OIDC_PROVIDERS_FILE:-}
      # Mount referenced files and pass each provider's client secret variable in an override.
      CERTHIA_MAX_CONCURRENT_SCANS: ${CERTHIA_MAX_CONCURRENT_SCANS:-1}
      CERTHIA_SCAN_TIMEOUT_MINUTES: ${CERTHIA_SCAN_TIMEOUT_MINUTES:-30}
      CERTHIA_BUILDKIT_ADDR: ${CERTHIA_BUILDKIT_ADDR:-}
      CERTHIA_S3_ENDPOINT: ${CERTHIA_S3_ENDPOINT:-}
      CERTHIA_S3_BUCKET: ${CERTHIA_S3_BUCKET:-}
      CERTHIA_S3_REGION: ${CERTHIA_S3_REGION:-us-east-1}
      CERTHIA_S3_ACCESS_KEY: ${CERTHIA_S3_ACCESS_KEY:-}
      CERTHIA_S3_SECRET_KEY: ${CERTHIA_S3_SECRET_KEY:-}
    volumes:
      - certhia-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  postgres-data:
  certhia-data:
